name: Opt-in read cache qualification

on:
  push:
    branches: [ci/qualified-ramsql-read-cache-20261117]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REVISION: d4255232adfd9069fd0e418768a1b82689cd3dfc
      SHARED_REVISION: fc6a052aeda17fb77e051f6cf40f258e11e0e8f5
      SHARED_SHA256: cc052eeecbe8a26a32aa713da76a9b554b7441c098d5bf1f0e29a8527e1720ce
      SIG_TAG: sig-0.6.5-zig0.17.0.3c72687
      SIG_ASSET: sig-0.6.5-zig0.17.0.3c72687-x86_64-linux.tar.xz
      SIG_SHA256: 179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_REVISION }}
      - name: Verify source pins and install Sig
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REVISION"
          mkdir -p evidence "$RUNNER_TEMP/sig-toolchain"
          printf '%s\n' "$PRODUCT_REVISION" > evidence/ramsql-revision.txt
          printf '%s\n' "$SHARED_REVISION" > evidence/zpm-revision.txt
          archive="$RUNNER_TEMP/$SIG_ASSET"
          curl --fail --location --retry 3 "https://github.com/SB0LTD/sig/releases/download/$SIG_TAG/$SIG_ASSET" --output "$archive"
          printf '%s  %s\n' "$SIG_SHA256" "$archive" | sha256sum --check --strict -
          tar -xf "$archive" -C "$RUNNER_TEMP/sig-toolchain"
          compiler=$(find "$RUNNER_TEMP/sig-toolchain" -type f -name sig -perm -u+x -print -quit)
          test -n "$compiler"
          lib="$(dirname "$(dirname "$compiler")")/lib"
          test -f "$lib/std/std.sig"
          echo "SIG=$compiler" >> "$GITHUB_ENV"
          "$compiler" version | tee evidence/sig-version.txt
          python tools/prepare_sig_runtime.py --installed-lib "$lib" --output "$RUNNER_TEMP/sig-runtime" --github-env "$GITHUB_ENV"
          zpm_archive="$RUNNER_TEMP/zpm-cache-source.tar.gz"
          curl --fail --location --retry 3 "https://github.com/SB0LTD/zpm/archive/$SHARED_REVISION.tar.gz" --output "$zpm_archive"
          printf '%s  %s\n' "$SHARED_SHA256" "$zpm_archive" | sha256sum --check --strict -
          grep -F "archive/$SHARED_REVISION.tar.gz" build.sig.zon
          grep -F "$SHARED_SHA256" build.sig.zon
          mkdir -p "$RUNNER_TEMP/zpm-cache-source"
          tar -xf "$zpm_archive" --strip-components=1 -C "$RUNNER_TEMP/zpm-cache-source"
          cp build.sig.zon evidence/build.sig.zon
      - name: Build the exact packed-capable RAMSQL artifact
        run: |
          set -euo pipefail
          "$SIG" build -Doptimize=ReleaseSafe -Dintegral-version-banks=true 2>&1 | tee evidence/build.txt
          install -m 755 sig-out/bin/ramsql evidence/ramsql
          (cd evidence && sha256sum ramsql > SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          cp "$SIG_RUNTIME_PREPARATION" evidence/runtime-preparation.json
      - name: Verify cache accounting, query controls and snapshot invalidation
        run: |
          set -euo pipefail
          python tools/test_cli.py --binary evidence/ramsql --expect-integral-version-banks | tee evidence/cli.txt
          python tools/test_server.py --binary evidence/ramsql --workers 2 --integral-version-banks | tee evidence/server.txt
          evidence/ramsql --capabilities --workers 2 --read-cache-bytes 8388608 > evidence/capabilities.json
          evidence/ramsql --machine-capacity --workers 2 --read-cache-bytes 8388608 > evidence/machine-capacity.json
      - name: Verify cache hits and cancellation in the pinned shared core
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/zpm-cache-source"
          "$SIG" build run-contract-parallel-read -Doptimize=ReleaseSafe --Sig-lib-dir "$SIG_LIB_DIR" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/zpm-parallel-read.txt"
          grep -E 'PASS|"pass":true' "$GITHUB_WORKSPACE/evidence/zpm-parallel-read.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramsql-opt-in-read-cache
          path: evidence/
          if-no-files-found: error
