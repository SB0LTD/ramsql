name: Beta 3 hosted runtime qualification

on:
  push:
    branches: [ci/beta3-runtime-20261117]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7654ad51b928690930c6fbaee1d9cdfbf855e6c6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified Sig toolchain
        shell: pwsh
        run: |
          $identity = python tools/release_matrix.py --compiler-host Linux/X64 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP $identity.asset
          $destination = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'cluster-sig')
          Invoke-WebRequest "https://github.com/SB0LTD/sig/releases/download/$($identity.tag)/$($identity.asset)" -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $identity.sha256) { throw 'Sig checksum mismatch' }
          tar -xf $archive -C $destination.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem -Path $destination.FullName -Recurse -File -Filter sig | Select-Object -First 1
          $library = Get-ChildItem -Path $destination.FullName -Recurse -Directory -Filter lib | Where-Object { Test-Path (Join-Path $_.FullName 'std/std.sig') } | Select-Object -First 1
          if ($null -eq $compiler -or $null -eq $library) { throw 'Incomplete Sig SDK' }
          "SIG=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/prepare_sig_runtime.py --installed-lib "$($library.FullName)" --output "$env:RUNNER_TEMP/sig-runtime" --github-env "$env:GITHUB_ENV"
      - name: Verify revision and build the hosted typed profile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7654ad51b928690930c6fbaee1d9cdfbf855e6c6
          mkdir -p evidence
          "$SIG" build -Doptimize=ReleaseSafe -Dintegral-version-banks=true 2>&1 | tee evidence/build.log
          sha256sum sig-out/bin/ramsql > evidence/binary.sha256
      - name: Exercise cluster, wire, credential ownership and prepared recovery
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-test.txt
          python tools/test_database_cluster.py | tee evidence/cluster.log
          python tools/test_cli.py --expect-integral-version-banks | tee evidence/cli.log
          python tools/test_server.py --workers 4 --integral-version-banks | tee evidence/server.log
          python tools/test_auth.py --workers 4 | tee evidence/auth.log
          python tools/test_persistence.py --integral-prepared | tee evidence/persistence.log
          python tools/test_machine_capacity.py | tee evidence/machine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta3-hosted-runtime
          path: evidence/
