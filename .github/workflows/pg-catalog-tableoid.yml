name: Native PostgreSQL namespace dependency contract

on:
  push:
    branches: [ci/schema-drop-dependency-visibility-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    name: Native durable namespace dependency
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    defaults:
      run:
        shell: pwsh
    env:
      PRODUCT_REVISION: 6424940c45f56d1529a3531a8834234dfb4e792b
      PRODUCT_SHA256: 6562d8f0a6dec9024e840a44dd5831b820c1c7f5d233c7f30397d20006797b9e
      ZPM_REVISION: 4b60cd41f6fa5d48d73d1c111665956dee456783
      ZPM_SHA256: 977bee02aa9bf0f54e844558aa4a9de34f714ccf31bc231d7af56ba189b267d8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_REVISION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source, dependency and native SDK
        run: |
          if ((git rev-parse HEAD) -ne $env:PRODUCT_REVISION) { throw 'Unexpected RAMSQL source revision' }
          $null = New-Item -Type Directory -Force evidence
          $env:PRODUCT_REVISION > evidence/product-revision.txt
          $env:ZPM_REVISION > evidence/zpm-revision.txt
          function Verify-Archive($url, $wanted, $path) {
            Invoke-WebRequest -Uri $url -OutFile $path
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $wanted) { throw "Archive digest mismatch for $url" }
          }
          Verify-Archive "https://github.com/SB0LTD/ramsql/archive/$env:PRODUCT_REVISION.tar.gz" $env:PRODUCT_SHA256 (Join-Path $env:RUNNER_TEMP 'product.tar.gz')
          $zpmUrl = "https://github.com/SB0LTD/zpm/archive/$env:ZPM_REVISION.tar.gz"
          Verify-Archive $zpmUrl $env:ZPM_SHA256 (Join-Path $env:RUNNER_TEMP 'zpm.tar.gz')
          python tools/release_matrix.py --compiler-host "$env:RUNNER_OS/$env:RUNNER_ARCH" > evidence/compiler-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pin = Get-Content evidence/compiler-release.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $pin.asset
          $destination = (New-Item -Type Directory (Join-Path $env:RUNNER_TEMP 'sig-toolchain')).FullName
          Verify-Archive "https://github.com/SB0LTD/sig/releases/download/$($pin.tag)/$($pin.asset)" $pin.sha256 $archive
          if ($env:RUNNER_OS -eq 'Windows') {
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
            $name = 'sig.exe'
          } else {
            tar -xf $archive -C $destination
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $name = 'sig'
          }
          $compiler = @(Get-ChildItem $destination -Recurse -File |
            Where-Object { $_.Name -ceq $name -and $_.Directory.Name -ceq 'bin' })
          if ($compiler.Length -ne 1) { throw 'Expected one native Sig compiler' }
          $library = Join-Path $compiler[0].Directory.Parent.FullName 'lib'
          "SIG=$($compiler[0].FullName)" >> $env:GITHUB_ENV
          "SIG_LIB_DIR=$library" >> $env:GITHUB_ENV
          & $compiler[0].FullName version | Tee-Object evidence/sig-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the pinned runtime
        run: |
          python tools/prepare_sig_runtime.py --installed-lib $env:SIG_LIB_DIR `
            --output (Join-Path $env:RUNNER_TEMP 'runtime') --github-env $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact PostgreSQL catalog contract in ZPM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/zpm-source"
          mkdir "$core"
          tar -xf "$RUNNER_TEMP/zpm.tar.gz" -C "$core" --strip-components=1
          "$SIG" build-exe --Sig-lib-dir "$SIG_LIB_DIR" -OReleaseSafe --dep sql \
            "-Mroot=$core/tests/test_sql_catalog_security.sig" "-Msql=$core/src/core/sql.sig" \
            "-femit-bin=$RUNNER_TEMP/test-sql-catalog-security"
          "$RUNNER_TEMP/test-sql-catalog-security" 2>&1 | tee evidence/zpm-catalog.txt
          grep -Eq 'catalog security: [0-9]+ assertions, [0-9]+ records replayed' evidence/zpm-catalog.txt
      - name: Verify PostgreSQL 18.3 namespace dependency oracle
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          image=postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
          echo "$image" > evidence/reference-image.txt
          name=namespace-dependencies-oracle
          docker run --detach --name "$name" -e POSTGRES_HOST_AUTH_METHOD=trust "$image"
          trap 'docker rm --force --volumes "$name" >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$name" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec "$name" pg_isready -h 127.0.0.1 -U postgres
          docker exec "$name" postgres --version | tee evidence/reference-version.txt
          docker exec -i "$name" psql -U postgres -XAtq -v ON_ERROR_STOP=1 <<'SQL' > evidence/native-dependency.txt
          CREATE TABLE anchor (id int);
          INSERT INTO anchor VALUES (1);
          CREATE SCHEMA view_space;
          CREATE VIEW view_space.drop_view_probe AS SELECT id FROM anchor;
          \set ON_ERROR_STOP off
          DROP SCHEMA view_space;
          \echo view_restrict :SQLSTATE
          \set ON_ERROR_STOP on
          CREATE MATERIALIZED VIEW view_space.drop_mat_probe AS SELECT id FROM anchor;
          BEGIN;
          DROP SCHEMA view_space CASCADE;
          SELECT 'within_abort ' || count(*) FROM pg_namespace WHERE nspname='view_space';
          ROLLBACK;
          SELECT 'after_abort ' || count(*) FROM pg_class WHERE relname IN ('drop_view_probe','drop_mat_probe');
          DROP SCHEMA view_space CASCADE;
          SELECT 'after_cascade ' || count(*) FROM pg_class WHERE relname IN ('drop_view_probe','drop_mat_probe');

          CREATE SCHEMA late_space;
          BEGIN ISOLATION LEVEL REPEATABLE READ;
          SELECT 'restrict_snapshot ' || count(*) FROM anchor;
          \! psql -U postgres -XAtq -v ON_ERROR_STOP=1 -c 'CREATE TABLE late_space.new_table (id int)'
          \set ON_ERROR_STOP off
          DROP SCHEMA late_space;
          \echo late_restrict :SQLSTATE
          \set ON_ERROR_STOP on
          ROLLBACK;

          BEGIN ISOLATION LEVEL REPEATABLE READ;
          SELECT 'cascade_snapshot ' || count(*) FROM anchor;
          \! psql -U postgres -XAtq -v ON_ERROR_STOP=1 -c 'CREATE VIEW late_space.new_view AS SELECT id FROM anchor'
          DROP SCHEMA late_space CASCADE;
          COMMIT;
          SELECT 'late_after_cascade ' || count(*) FROM pg_class WHERE relname IN ('new_table','new_view');

          CREATE SCHEMA old_space;
          BEGIN ISOLATION LEVEL REPEATABLE READ;
          SELECT 'create_snapshot ' || count(*) FROM anchor;
          \! psql -U postgres -XAtq -v ON_ERROR_STOP=1 -c 'DROP SCHEMA old_space'
          \set ON_ERROR_STOP off
          CREATE TABLE old_space.stranded (id int);
          \echo stale_create :SQLSTATE
          \set ON_ERROR_STOP on
          ROLLBACK;
          SQL
          cat > "$RUNNER_TEMP/native-expected.txt" <<'EOF'
          view_restrict 2BP01
          within_abort 0
          after_abort 2
          after_cascade 0
          restrict_snapshot 1
          late_restrict 2BP01
          cascade_snapshot 1
          late_after_cascade 0
          create_snapshot 1
          stale_create 3F000
          EOF
          diff -u "$RUNNER_TEMP/native-expected.txt" evidence/native-dependency.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-schema-dependency-visibility
          path: evidence/
          if-no-files-found: error
