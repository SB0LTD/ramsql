name: PostgreSQL extended transaction qualification

on:
  push:
    branches: [ci/postgres-extended-sync-transaction-20261118]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified Sig toolchain
        shell: bash
        run: |
          read -r tag asset digest < <(python tools/release_matrix.py --compiler-host Linux/X64 |
            python -c 'import json,sys; x=json.load(sys.stdin); print(x["tag"],x["asset"],x["sha256"])')
          curl -fsSL --retry 3 "https://github.com/SB0LTD/sig/releases/download/$tag/$asset" -o "$RUNNER_TEMP/$asset"
          echo "$digest  $RUNNER_TEMP/$asset" | sha256sum -c
          mkdir "$RUNNER_TEMP/sig"
          tar -xf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sig"
          binary=$(find "$RUNNER_TEMP/sig" -type f -name sig | head -n 1)
          standard=$(find "$RUNNER_TEMP/sig" -type f -path '*/lib/std/std.sig' | head -n 1)
          test -x "$binary"
          test -f "$standard"
          printf 'SIG=%s\n' "$binary" >> "$GITHUB_ENV"
          python tools/prepare_sig_runtime.py --installed-lib "${standard%/std/std.sig}" \
            --output "$RUNNER_TEMP/sig-runtime" --github-env "$GITHUB_ENV"
      - name: Compare the exact server binary with native PostgreSQL and reopen both WALs
        shell: bash
        run: |
          mkdir evidence
          "$SIG" build -Doptimize=ReleaseSafe -Dcolumns=16 2>&1 | tee evidence/build.log
          python -m pip install 'psycopg[binary]==3.3.2'
          image=postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
          docker run --detach --name extended-native --publish 127.0.0.1::5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=ramsql -e POSTGRES_DB=ramsql "$image"
          for attempt in $(seq 1 60); do
            if docker exec extended-native pg_isready -h 127.0.0.1 -U ramsql; then break; fi
            sleep 1
          done
          docker exec extended-native pg_isready -h 127.0.0.1 -U ramsql
          endpoint=$(docker port extended-native 5432/tcp)
          python tools/qualify_pg_extended_sync.py --binary sig-out/bin/ramsql \
            --postgres-port "${endpoint##*:}" --report evidence/extended-sync.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-sync
          path: evidence/
