name: Opt-in native admission across wider 100M schemas

on:
  push:
    branches: [ci/wider-packed-admission-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    name: Native wider schema plans
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    defaults:
      run:
        shell: pwsh
    env:
      PRODUCT_REVISION: 9e4bcafa4367dbd92429b88bcbcf3970cac50ead
      PRODUCT_SHA256: 494701b33833f4cfc1b2775787f632af2097b0b0b3a64712d02782bf439b68d5
      ZPM_REVISION: 3182edc733f600594c45d24520df112816107b05
      ZPM_SHA256: 6b57a32ff044e560104aa838b22c4ec3891047efc66c610ba3133dea31942a29
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_REVISION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source, dependency and native SDK
        run: |
          if ((git rev-parse HEAD) -ne $env:PRODUCT_REVISION) { throw 'Unexpected RAMSQL source revision' }
          $null = New-Item -Type Directory -Force evidence,sig-out
          $env:PRODUCT_REVISION > evidence/product-revision.txt
          $env:ZPM_REVISION > evidence/zpm-revision.txt
          function Verify-Archive($url, $wanted, $path) {
            Invoke-WebRequest -Uri $url -OutFile $path
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $wanted) { throw "Archive digest mismatch for $url" }
          }
          Verify-Archive "https://github.com/SB0LTD/ramsql/archive/$env:PRODUCT_REVISION.tar.gz" $env:PRODUCT_SHA256 (Join-Path $env:RUNNER_TEMP 'product.tar.gz')
          $zpmUrl = "https://github.com/SB0LTD/zpm/archive/$env:ZPM_REVISION.tar.gz"
          $zon = Get-Content build.sig.zon -Raw
          if (-not $zon.Contains($zpmUrl) -or -not $zon.Contains($env:ZPM_SHA256)) { throw 'Unexpected ZPM dependency pin' }
          Verify-Archive $zpmUrl $env:ZPM_SHA256 (Join-Path $env:RUNNER_TEMP 'zpm.tar.gz')
          python tools/release_matrix.py --compiler-host "$env:RUNNER_OS/$env:RUNNER_ARCH" > evidence/compiler-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pin = Get-Content evidence/compiler-release.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $pin.asset
          $destination = (New-Item -Type Directory (Join-Path $env:RUNNER_TEMP 'sig-toolchain')).FullName
          Verify-Archive "https://github.com/SB0LTD/sig/releases/download/$($pin.tag)/$($pin.asset)" $pin.sha256 $archive
          if ($env:RUNNER_OS -eq 'Windows') {
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
            $name = 'sig.exe'
          } else {
            tar -xf $archive -C $destination
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $name = 'sig'
          }
          $compiler = @(Get-ChildItem $destination -Recurse -File |
            Where-Object { $_.Name -ceq $name -and $_.Directory.Name -ceq 'bin' })
          if ($compiler.Length -ne 1) { throw 'Expected one native Sig compiler' }
          $library = Join-Path $compiler[0].Directory.Parent.FullName 'lib'
          "SIG=$($compiler[0].FullName)" >> $env:GITHUB_ENV
          "SIG_LIB_DIR=$library" >> $env:GITHUB_ENV
          & $compiler[0].FullName version | Tee-Object evidence/sig-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the pinned runtime
        run: |
          python tools/prepare_sig_runtime.py --installed-lib $env:SIG_LIB_DIR `
            --output (Join-Path $env:RUNNER_TEMP 'runtime') --github-env $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify rebased storage and projected Top-N
        run: |
          $zpm = (New-Item -Type Directory (Join-Path $env:RUNNER_TEMP 'zpm')).FullName
          tar -xf (Join-Path $env:RUNNER_TEMP 'zpm.tar.gz') -C $zpm --strip-components=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('compact_version_stamps', 'external_hash_load', 'projected_filter', 'change_log')) {
            $binary = Join-Path $env:RUNNER_TEMP $test
            & $env:SIG build-exe --Sig-lib-dir $env:SIG_LIB_DIR -OReleaseSafe --dep sql "-Mroot=$zpm/tests/test_sql_$test.sig" "-Msql=$zpm/src/core/sql.sig" "-femit-bin=$binary"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $binary 2>&1 | Tee-Object "evidence/zpm-$test.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build combined opt-in variant and qualify supported startup
        run: |
          & $env:SIG build -Doptimize=ReleaseSafe -Dhosted-client-ceiling=128 -Dintegral-version-banks=true -Dcompact-version-stamps=true 2>&1 | Tee-Object evidence/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = (Resolve-Path 'sig-out/bin/ramsql').Path
          (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() > evidence/binary-sha256.txt
          python tools/test_cli.py --binary $binary --expect-integral-version-banks --expect-compact-version-stamps 2>&1 | Tee-Object evidence/cli.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_hosted_128_admission.py --binary $binary --report evidence/admission-128.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise wide schema placement and compute exact RAM for 100M rows per table
        run: |
          $binary = (Resolve-Path 'sig-out/bin/ramsql').Path
          python tools/test_wider_admission.py --binary $binary --report evidence/wider-native-plans.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content evidence/wider-native-plans.json -Raw | ConvertFrom-Json
          if ($report.suite -ne 'wider_100m_admission' -or $report.passed -ne $true -or $report.plans.Length -ne 33) {
            throw 'Wider admission cases did not execute'
          }
          '' >> $env:GITHUB_STEP_SUMMARY
          'Each 100M entry is a native capacity probe. Real schema placement and SQL mutation run on separate small fixtures.' >> $env:GITHUB_STEP_SUMMARY
          '| Schema combination | Clients | Planned active bytes | Sampled grant | Fits |' >> $env:GITHUB_STEP_SUMMARY
          '|---|---:|---:|---:|---|' >> $env:GITHUB_STEP_SUMMARY
          foreach ($plan in $report.plans) {
            $native = $plan.machine_capacity
            "| $($plan.case) | $($plan.clients) | $($native.active_admission_bytes) | $($native.new_region_bytes) | $($native.active_admission_fits) |" >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wider-packed-admission-evidence
          path: evidence/
          if-no-files-found: error
