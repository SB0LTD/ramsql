name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  SIG_RELEASE_TAG: sig-0.6.3-zig0.17.0.ac9b716

jobs:
  native:
    name: Native Sig (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: sig-0.6.3-zig0.17.0.ac9b716-x86_64-linux.tar.xz
            sha256: e1c1560fc7be0d6b1a0b04ffbdbc899023d64ded0bf65a654f61ffbbc9200277
          - os: ubuntu-24.04-arm
            asset: sig-0.6.3-zig0.17.0.ac9b716-aarch64-linux.tar.xz
            sha256: e155e7dc25630bd7dbfe19ab91a01ae86bbf5227ba3880d70c9d8f10952722c7
          - os: macos-latest
            asset: sig-0.6.3-zig0.17.0.ac9b716-aarch64-macos.tar.xz
            sha256: 995b3d7c0c83cf5a7f8722a6401c8f6709e7d23516f74b0c6b75b44ffc3e4d92
          - os: windows-latest
            asset: sig-0.6.3-zig0.17.0.ac9b716-x86_64-windows.zip
            sha256: 5d0e883b64129715eb86baec43005c72050b93bef5fe7172fdc4f20e4efad8a2
    defaults:
      run:
        shell: pwsh
    env:
      SIG_RELEASE_ASSET: ${{ matrix.asset }}
      SIG_RELEASE_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checksum-verified Sig release
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:SIG_RELEASE_ASSET
          $destination = Join-Path $env:RUNNER_TEMP "sig-toolchain"
          $url = "https://github.com/SB0LTD/sig/releases/download/$env:SIG_RELEASE_TAG/$env:SIG_RELEASE_ASSET"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:SIG_RELEASE_SHA256) {
            throw "Sig release checksum mismatch: $actual"
          }
          New-Item -ItemType Directory -Path $destination | Out-Null
          if ($env:RUNNER_OS -eq "Windows") {
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
            $binaryName = "sig.exe"
          } else {
            tar -xf $archive -C $destination
            if ($LASTEXITCODE -ne 0) { throw "Sig release extraction failed" }
            $binaryName = "sig"
          }
          $compiler = Get-ChildItem -LiteralPath $destination -File -Recurse |
            Where-Object Name -eq $binaryName | Select-Object -First 1
          $library = Get-ChildItem -LiteralPath $destination -Directory -Recurse |
            Where-Object { $_.Name -eq "lib" -and (Test-Path (Join-Path $_.FullName "std/std.sig")) } |
            Select-Object -First 1
          if ($null -eq $compiler -or $null -eq $library) {
            throw "Sig release must contain both the compiler and its matched standard library"
          }
          "SIG=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIG_LIB_DIR=$($library.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $compiler.FullName version
          if ($LASTEXITCODE -ne 0) { throw "Sig compiler did not start" }

      - name: Test release matrix and deterministic packaging
        run: python tools/test_release.py

      - name: Build RAMSQL
        run: |
          $arguments = @('build', '-Doptimize=ReleaseSafe')
          if ($env:RUNNER_OS -eq 'macOS') { $arguments += '-Dlink-libc=true' }
          & $env:SIG @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test allocator-free database and library
        run: |
          $arguments = @('build', 'test', '-Doptimize=ReleaseSafe')
          if ($env:RUNNER_OS -eq 'macOS') { $arguments += '-Dlink-libc=true' }
          & $env:SIG @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run demonstration
        run: |
          $binary = if ($env:RUNNER_OS -eq "Windows") { "./sig-out/bin/ramsql.exe" } else { "./sig-out/bin/ramsql" }
          & $binary --demo

      - name: Test command line and bounded SQL streams
        run: python tools/test_cli.py

      - name: Test TCP framing, fairness, limits and session cleanup
        run: python tools/test_server.py

      - name: Install independent database clients for tests
        run: python -m pip install -r tools/requirements-test.txt

      - name: Test PostgreSQL, MySQL and SQL Server clients
        run: python tools/test_clients.py

      - name: Test SCRAM authentication with independent clients
        run: python tools/test_auth.py

      - name: Test durable commits, process crashes, corruption and offline restore
        run: python tools/test_persistence.py

      - name: Build and run native performance smoke benchmark
        run: |
          $arguments = @('build', 'benchmark', '-Doptimize=ReleaseFast')
          if ($env:RUNNER_OS -eq 'macOS') { $arguments += '-Dlink-libc=true' }
          & $env:SIG @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
