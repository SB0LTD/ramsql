name: Qualify reads during grouped WAL sync

on:
  push:
    branches: [ci/read-during-wal-flush-20261118]

permissions:
  contents: read

jobs:
  delayed-wal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the exact source archives and compiler
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/sig-sdk"
          source=f7b14728160d7ad30448fbdcd58cb49dd31e4873
          git diff --exit-code "$source" -- src build.sig build.sig.zon tools/test_group_commit.py tools/test_wal_read_window.py
          git rev-parse HEAD "$source" > evidence/source.log
          zpm=c61826fe68829fabff93625f83ee5e903c62c366
          digest=556ae38967862c98f004ed431b6d771b3c4051dd6c9d8f80fabce58ce6d9b411
          grep -F "$zpm.tar.gz" build.sig.zon
          grep -F "$digest" build.sig.zon
          curl --fail --location --silent --show-error "https://github.com/SB0LTD/zpm/archive/$zpm.tar.gz" -o "$RUNNER_TEMP/zpm.tar.gz"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/zpm.tar.gz" | sha256sum -c - | tee evidence/zpm.log
          tag=sig-0.6.5-zig0.17.0.3c72687
          archive="$RUNNER_TEMP/$tag-x86_64-linux.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/SB0LTD/sig/releases/download/$tag/$(basename "$archive")" -o "$archive"
          printf '%s  %s\n' 179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a "$archive" \
            | sha256sum -c - | tee evidence/sdk.log
          tar -xJf "$archive" -C "$RUNNER_TEMP/sig-sdk"
          compiler="$(find "$RUNNER_TEMP/sig-sdk" -type f -path '*/bin/sig' -print -quit)"
          test -x "$compiler"
          sha256sum "$compiler" >> evidence/sdk.log
          "$compiler" version | tee -a evidence/sdk.log
          echo "SIG=$compiler" >> "$GITHUB_ENV"
          echo "SIG_LIB_DIR=$(dirname "$(dirname "$compiler")")/lib" >> "$GITHUB_ENV"
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y strace
          fi
          strace --version > evidence/strace.log
      - name: Build ReleaseSafe RAMSQL
        run: |
          set -euo pipefail
          "$SIG" build -Doptimize=ReleaseSafe -j2 --Sig-lib-dir "$SIG_LIB_DIR" 2>&1 | tee evidence/build.log
          sha256sum sig-out/bin/ramsql | tee evidence/binary-sha256.log
      - name: Check real delayed and failed WAL sync with native PostgreSQL sockets
        run: |
          set -euo pipefail
          python tools/test_wal_read_window.py --binary sig-out/bin/ramsql --strace "$(command -v strace)" \
            --work-dir "$RUNNER_TEMP/wal-read-window" --output evidence/read-window 2>&1 | tee evidence/read-window.log
      - name: Check existing group commit and wire behavior on the same binary
        run: |
          set -euo pipefail
          python tools/test_group_commit.py --binary sig-out/bin/ramsql --strace "$(command -v strace)" \
            --work-dir "$RUNNER_TEMP/ordinary-group" --output evidence/ordinary-group 2>&1 | tee evidence/ordinary-group.log
          RAMSQL_BINARY="$PWD/sig-out/bin/ramsql" python tools/test_server.py 2>&1 | tee evidence/wire.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delayed-wal-read-window
          path: evidence/
