name: Release matrix

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'tools/**'
      - 'src/**'
      - 'build.sig*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag; must equal v plus the checked-out source version'
        required: false
        type: string
      publish:
        description: 'Publish after every build and test passes (development versions are prereleases)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate version, matrix and release policy
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      hosted_matrix: ${{ steps.meta.outputs.hosted_matrix }}
      native_matrix: ${{ steps.meta.outputs.native_matrix }}
      native_sig_revision: ${{ steps.meta.outputs.native_sig_revision }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      revision: ${{ steps.source.outputs.revision }}
      epoch: ${{ steps.source.outputs.epoch }}
      sig_tag: ${{ steps.meta.outputs.sig_tag }}
      sig_asset: ${{ steps.meta.outputs.sig_asset }}
      sig_sha256: ${{ steps.meta.outputs.sig_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release packaging contracts
        run: python tools/test_release.py
      - name: Resolve immutable source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve release metadata
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            REQUESTED_TAG="$GITHUB_REF_NAME"
          fi
          args=()
          if [[ -n "$REQUESTED_TAG" ]]; then args+=(--tag "$REQUESTED_TAG"); fi
          python tools/release_matrix.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Require production evidence for stable versions
        if: steps.meta.outputs.prerelease != 'true'
        run: python tools/release_gate.py

  # Reuse the same native contract, independent client, authentication and crash
  # tests that gate main. The caller and reusable workflow use the same SHA.
  native-tests:
    name: Native operating system validation
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      skip_differential: true

  postgres-qualification:
    name: Qualify exact Linux release against PostgreSQL
    needs: [metadata, build]
    uses: ./.github/workflows/postgres.yml
    with:
      artifact_name: release-x86_64-linux
      revision: ${{ needs.metadata.outputs.revision }}

  build:
    name: Cross-build hosted ${{ matrix.slug }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.hosted_matrix) }}
    env:
      SIG_RELEASE_TAG: ${{ needs.metadata.outputs.sig_tag }}
      SIG_RELEASE_ASSET: ${{ needs.metadata.outputs.sig_asset }}
      SIG_RELEASE_SHA256: ${{ needs.metadata.outputs.sig_sha256 }}
      SOURCE_REVISION: ${{ needs.metadata.outputs.revision }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
      TARGET_SLUG: ${{ matrix.slug }}
      TARGET_TRIPLE: ${{ matrix.triple }}
      TARGET_FORMAT: ${{ matrix.format }}
      TARGET_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-verified Sig with its matching library
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$SIG_RELEASE_ASSET"
          destination="$RUNNER_TEMP/sig-toolchain"
          curl --fail --location --retry 3 \
            "https://github.com/SB0LTD/sig/releases/download/$SIG_RELEASE_TAG/$SIG_RELEASE_ASSET" \
            --output "$archive"
          printf '%s  %s\n' "$SIG_RELEASE_SHA256" "$archive" | sha256sum --check --strict -
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          compiler="$(find "$destination" -type f -name sig -print -quit)"
          library_marker="$(find "$destination" -type f -path '*/lib/std/std.sig' -print -quit)"
          test -n "$compiler" && test -n "$library_marker"
          chmod +x "$compiler"
          library="$(dirname "$(dirname "$library_marker")")"
          echo "SIG=$compiler" >> "$GITHUB_ENV"
          echo "SIG_LIB_DIR=$library" >> "$GITHUB_ENV"
          dirname "$compiler" >> "$GITHUB_PATH"
          "$compiler" version
      - name: Cross-compile hosted server
        if: matrix.kind == 'hosted'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$TARGET_SLUG" == *-macos ]]; then args+=(-Dlink-libc=true); fi
          "$SIG" build -Dtarget="$TARGET_TRIPLE" -Doptimize=ReleaseFast \
            --prefix ".sig-cache/release/$TARGET_SLUG" "${args[@]}"
      - name: Package deterministic archive with source, license and capability manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/package_release.py package --target "$TARGET_SLUG" \
            --binary ".sig-cache/release/$TARGET_SLUG/bin/$TARGET_BINARY" \
            --output dist --revision "$SOURCE_REVISION" --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --optimize ReleaseFast
      - name: Upload verified platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  native-toolchain:
    name: Bootstrap pinned Sig and validate native SB0X and SB0K
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NATIVE_SIG_REVISION: ${{ needs.metadata.outputs.native_sig_revision }}
      SIG_RELEASE_TAG: ${{ needs.metadata.outputs.sig_tag }}
      SIG_RELEASE_ASSET: ${{ needs.metadata.outputs.sig_asset }}
      SIG_RELEASE_SHA256: ${{ needs.metadata.outputs.sig_sha256 }}
      SOURCE_REVISION: ${{ needs.metadata.outputs.revision }}
      SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - name: Require reviewed immutable native compiler source
        shell: bash
        run: |
          if [[ ! "$NATIVE_SIG_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Native compiler source pin is pending verified SB0 database and loader QEMU tests.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: SB0LTD/sig
          ref: ${{ needs.metadata.outputs.native_sig_revision }}
          path: .sig-cache/native-sig-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-verified published Sig bootstrap
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$SIG_RELEASE_ASSET"
          destination="$RUNNER_TEMP/sig-bootstrap"
          curl --fail --location --retry 3 \
            "https://github.com/SB0LTD/sig/releases/download/$SIG_RELEASE_TAG/$SIG_RELEASE_ASSET" --output "$archive"
          printf '%s  %s\n' "$SIG_RELEASE_SHA256" "$archive" | sha256sum --check --strict -
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          compiler="$(find "$destination" -type f -name sig -print -quit)"
          test -n "$compiler"
          chmod +x "$compiler"
          echo "SIG_BOOTSTRAP=$compiler" >> "$GITHUB_ENV"
          "$compiler" version
      - name: Build native code-generation compiler from pinned Sig source
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.sig-cache/native-sig-source"
          test "$(git -C "$source" rev-parse HEAD)" = "$NATIVE_SIG_REVISION"
          mkdir -p "$RUNNER_TEMP/native-toolchain/bin"
          bash "$source/ci/build-sb0-codegen.sh" "$SIG_BOOTSTRAP" \
            "$RUNNER_TEMP/native-toolchain/bin/sig" "$RUNNER_TEMP/native-compiler-cache"
          cp -a "$source/lib" "$RUNNER_TEMP/native-toolchain/lib"
      - name: Verify native database code generation under QEMU
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v qemu-system-aarch64 >/dev/null; then
            # Some hosted runners throttle this mirror to a few KiB/s. Keep
            # Ubuntu's signed package validation and use its official archive.
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y qemu-system-arm ipxe-qemu
          fi
          bash .sig-cache/native-sig-source/ci/test-sb0-database-codegen.sh \
            "$RUNNER_TEMP/native-toolchain/bin/sig" "$RUNNER_TEMP/native-probe"
      - name: Record exact compiler, source, library and bootstrap provenance
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from package_release import published_toolchain
          root = Path(os.environ['RUNNER_TEMP']) / 'native-toolchain'
          compiler = root / 'bin/sig'
          revision = os.environ['NATIVE_SIG_REVISION']
          record = {'schema': 1, 'kind': 'source-build',
                    'source_repository': 'https://github.com/SB0LTD/sig', 'source_revision': revision,
                    'library_revision': revision, 'compiler_sha256': hashlib.sha256(compiler.read_bytes()).hexdigest(),
                    'compiler_version': subprocess.check_output([str(compiler), 'version'], text=True).strip(),
                    'bootstrap': published_toolchain(), 'llvm_backend': False,
                    'build_command': 'ci/build-sb0-codegen.sh BOOTSTRAP OUTPUT CACHE',
                    'database_codegen_qemu': 'passed'}
          (root / 'toolchain.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-sb0-toolchain
          path: ${{ runner.temp }}/native-toolchain/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Build, execute and package both native image formats on the verified QEMU host
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-toolchain"
          expected="$(python -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ["RUNNER_TEMP"])/"native-toolchain/toolchain.json").read_text())["compiler_sha256"])')"
          printf '%s  %s\n' "$expected" "$root/bin/sig" | sha256sum --check --strict -
          export SIG="$root/bin/sig" SIG_LIB_DIR="$root/lib"
          for format in sb0x sb0k; do
            slug="aarch64-sb0-$format"
            directory=".sig-cache/release/$slug"
            binary="$directory/bin/ramsql.$format"
            python tools/build_sb0.py --format "$format" --optimize ReleaseSmall --output "$binary"
            python tools/test_sb0.py --format "$format" --image "$binary" --report "$directory/runtime-test.json"
            python tools/package_release.py package --target "$slug" --binary "$binary" --output "dist/$slug" \
              --revision "$SOURCE_REVISION" --source-date-epoch "$SOURCE_DATE_EPOCH" --optimize ReleaseSmall \
              --verification "$directory/runtime-test.json" --toolchain-manifest "$root/toolchain.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-aarch64-sb0-sb0x
          path: dist/aarch64-sb0-sb0x/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-aarch64-sb0-sb0k
          path: dist/aarch64-sb0-sb0k/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics
          path: .sig-cache/release/
          if-no-files-found: ignore
          retention-days: 14

  hosted-runtime:
    name: Execute release artifact (${{ matrix.slug }})
    needs: [metadata, build]
    # Hosted artifacts still get tested when an independent native image fails.
    if: always() && needs.metadata.result == 'success' && !cancelled()
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.hosted_matrix) }}
    env:
      SOURCE_REVISION: ${{ needs.metadata.outputs.revision }}
      TARGET_SLUG: ${{ matrix.slug }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Windows ARM executes the native ARM64 server with x64 Python clients
          # under OS emulation; client ISA is recorded separately in evidence.
          architecture: ${{ matrix.python_arch }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: .sig-cache/release-input
      - name: Verify archive, provenance, hashes and architecture; install exact release binary
        run: |
          python tools/package_release.py verify --input .sig-cache/release-input `
            --target $env:TARGET_SLUG --revision $env:SOURCE_REVISION `
            --install-bin sig-out/bin --report .sig-cache/verified-artifact.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install independent database clients
        run: python -m pip install -r tools/requirements-test.txt
      - name: Test command line and bounded SQL streams
        run: python tools/test_cli.py
      - name: Test TCP framing, fairness and lifecycle
        run: python tools/test_server.py
      - name: Test PostgreSQL, MySQL and SQL Server client interoperability
        run: python tools/test_clients.py
      - name: Test authenticated PostgreSQL access
        run: python tools/test_auth.py
      - name: Test synchronous durability, corruption and crash recovery
        run: python tools/test_persistence.py

      - name: Require runtime row capacity and durable restore beyond the inline profile
        run: python tools/test_capacity.py
      - name: Validate credential onboarding against the exact release binary
        run: python tools/test_beta.py
      - name: Verify runtime budgets and reviewer regressions on the exact artifact
        run: python tools/test_reviewer_runtime.py

      - name: Require native worker shared-store and protocol safety on exact artifact
        run: python tools/test_workers.py
      - name: Bind passed runtime tests to exact archive and binary hashes
        run: |
          python tools/package_release.py runtime-report --verification .sig-cache/verified-artifact.json `
            --report "runtime-evidence/runtime-$env:TARGET_SLUG.json" `
            --tests tools/test_cli.py tools/test_server.py tools/test_clients.py tools/test_auth.py tools/test_persistence.py tools/test_capacity.py tools/test_beta.py tools/test_reviewer_runtime.py tools/test_workers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-runtime-${{ matrix.slug }}
          path: runtime-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: Benchmark exact Linux artifact against durable native PostgreSQL
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ needs.metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64-linux
          path: .sig-cache/benchmark-input
      - name: Install exact checksummed release image and independent client
        run: |
          set -euo pipefail
          python tools/package_release.py verify --input .sig-cache/benchmark-input \
            --target x86_64-linux --revision "$SOURCE_REVISION" --install-bin sig-out/bin
          python -m pip install -r tools/requirements-test.txt
      - name: Locate native PostgreSQL reference
        run: |
          set -euo pipefail
          if ! command -v pg_config >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql
          fi
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb" && test -x "$pg_bin/postgres"
          echo "PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Compare verified SQL subset with synchronous durability on both engines
        run: |
          python tools/benchmark_postgres.py --binary sig-out/bin/ramsql \
            --postgres-bin "$PG_BIN" --work-dir "$RUNNER_TEMP/ramsql-benchmark" \
            --operations 512 --trials 3 --clients 1 4 --report benchmark-evidence/benchmark-postgres.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: benchmark-evidence/benchmark-postgres.json
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Verify full matrix and attest release bundle
    needs: [metadata, native-tests, build, native-toolchain, hosted-runtime, benchmark, postgres-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_REVISION: ${{ needs.metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: hosted-runtime-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-evidence
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: postgres-qualification-*-release
          path: .sig-cache/qualification-evidence
      - name: Bind complete PostgreSQL qualification to the release image
        run: |
          binary_sha=$(python -c 'import json; print(json.load(open("dist/runtime-x86_64-linux.json"))["image_sha256"])')
          python tools/qualify_postgres.py merge --input .sig-cache/qualification-evidence \
            --output dist/postgres-qualification.json --revision "$SOURCE_REVISION" --binary-sha256 "$binary_sha"
      - name: Record native CI evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {"source_revision": os.environ["SOURCE_REVISION"],
                      "native_ci": "passed", "workflow": ".github/workflows/ci.yml",
                      "run": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                      "note": "Native CI and every hosted release artifact passed runtime validation; native SB0 images carry their exact-image QEMU evidence inside the archive."}
          Path("dist/native-ci-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Require every target and verify every checksum
        run: python tools/package_release.py assemble --output dist --revision "$SOURCE_REVISION"
      - name: Attest exact bundle bytes
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ramsql-release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish explicitly requested release
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [metadata, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      SOURCE_REVISION: ${{ needs.metadata.outputs.revision }}
      IS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ramsql-release-bundle
          path: dist
      - name: Verify publication bytes and production gate
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)
          if [[ "$IS_PRERELEASE" != "true" ]]; then python tools/release_gate.py; fi
      - name: Create immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -z "$remote" ]]; then
            git tag "$RELEASE_TAG" "$SOURCE_REVISION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          actual="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$actual" != "$SOURCE_REVISION" ]]; then
            echo '::error::Remote release tag does not resolve to the validated source revision.'
            exit 1
          fi
          args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_REVISION" --verify-tag --title "RAMSQL $RELEASE_TAG" \
            --notes-file compatibility/RELEASE.md "${args[@]}"
